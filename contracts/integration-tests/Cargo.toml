[package]
name = "slowcook-integration-tests"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false

[dependencies]

[dev-dependencies]
near-workspaces = { version = "=0.24.0", features = ["unstable"] }
tokio = { version = "1", features = ["full"] }
serde_json = "1"
anyhow = "1"
sha2 = "0.10"
hex = "0.4"
futures = "0.3"
# near-workspaces pulls native-tls; vendor OpenSSL so no system libssl-dev is needed.
openssl = { version = "0.10", features = ["vendored"] }
