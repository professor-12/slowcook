[package]
name = "slowcook-token"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "NEP-141 token template deployed once per SlowCook launch. Only the SlowCook factory can mint."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk.workspace = true
near-contract-standards.workspace = true

[dev-dependencies]
near-sdk = { workspace = true, features = ["unit-testing"] }

[package.metadata.near.reproducible_build]
image = "sourcescan/cargo-near:0.22.0-rust-1.97.0"
image_digest = "sha256:REPLACE_ME"
passed_env = []
container_build_command = ["cargo", "near", "build", "non-reproducible-wasm", "--locked"]
