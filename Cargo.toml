[workspace]
resolver = "2"
members = ["contracts/slowcook", "contracts/token", "contracts/integration-tests"]

[workspace.package]
edition = "2021"
license = "MIT"
repository = "https://github.com/professor-12/slowcook"

[workspace.dependencies]
near-sdk = "=5.30.1"
near-contract-standards = "=5.30.1"
uint = { version = "0.10", default-features = false }
hex = "0.4"
proptest = "1"

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true

# Optimise dependencies (near-sdk mock VM, proptest, sha2) in test builds: ~10x faster property tests.
[profile.dev.package."*"]
opt-level = 2
